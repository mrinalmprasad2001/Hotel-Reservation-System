{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
  .register-card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    padding: 2.5rem;
    margin-top: 5rem;
    transition: all 0.3s ease;
  }

  .register-title {
    font-weight: 700;
    color: #2e6f40;
    letter-spacing: 0.5px;
  }

  .form-control {
    border-radius: 12px;
    padding: 0.75rem;
    border: 1px solid #ccc;
  }

  .form-control:focus {
    border-color: #5cb85c;
    box-shadow: 0 0 5px rgba(92, 184, 92, 0.4);
  }

  .btn-success {
    background-color: #3c9a5f;
    border: none;
    border-radius: 12px;
    padding: 0.75rem;
    font-weight: 600;
    transition: background 0.3s ease;
  }

  .btn-success:hover {
    background-color: #2e6f40;
  }

  .register-note {
    margin-top: 1rem;
    font-size: 0.9rem;
  }

  .register-note a {
    color: #2e6f40;
    font-weight: 600;
    text-decoration: none;
  }

  .register-note a:hover {
    text-decoration: underline;
  }

  /* Success message styling */
  .alert-success {
    border-radius: 12px;
    font-weight: 500;
  }
</style>

<div class="container d-flex justify-content-center align-items-center">
  <div class="col-md-6">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success text-center mt-4">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <div class="register-card">
      <h2 class="text-center register-title mb-4">Create an Account</h2>
      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-3">Register</button>
      </form>
      <p class="text-center register-note">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
